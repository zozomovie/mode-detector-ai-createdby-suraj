<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Camera Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            width: min(900px, 94%);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: auto;
            overflow: hidden;
            border-radius: 20px;
            background: #111;
            box-shadow: 0 0 40px rgba(255, 0, 80, 0.25);
        }

        video {
            width: 100%;
            display: block;
            transform: scaleX(1);
        }

        button {
            margin-top: 20px;
            padding: 14px 28px;
            border: 0;
            border-radius: 12px;
            background: #ff174d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e6003f;
        }

        #status {
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📷 AI Camera Test</h1>

    <div class="camera-box">
        <video id="camera" autoplay playsinline></video>
    </div>

    <button onclick="startCamera()">
        Open Camera
    </button>

    <div id="status">
        Camera is not started
    </div>

</div>

<script>

async function startCamera() {

    const video = document.getElementById("camera");
    const status = document.getElementById("status");

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        status.textContent = "✅ Camera is working";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Camera permission denied or camera unavailable";

    }

}

</script>

</body>
</html>
